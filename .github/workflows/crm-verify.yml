# Verifica el backend. No despliega y no usa secretos de producción.
# Cinco suites ya fallaban antes de CRM-010 y quedan fuera de esta compuerta:
# chat.service, chat.controller, resume-pending-quote-pricing,
# vehicle-pricing-profile e incoming-message.debounce.
name: CRM verify

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRM008_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/explicit-staging-migration.test.mjs scripts/await-staging-deployment.test.mjs scripts/assert-staging-restore.test.mjs scripts/staging-backup-crypto.test.mjs scripts/staging-private-backup.test.mjs scripts/staging-tls-evidence.test.mjs
      - run: npm test -- --runInBand --testPathIgnorePatterns='/node_modules/|/dist/|chat\.service\.spec|chat\.controller\.spec|resume-pending-quote-pricing|vehicle-pricing-profile\.spec|incoming-message\.debounce'
      - run: npm run build
