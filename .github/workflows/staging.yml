# Único publicador del backend de staging.
# Railway → pegazuz-backend-staging → Settings → Deploy → Disable.
# No actives Wait for CI: eso volvería a publicar el mismo push.
# STAGING_DEPLOY_ENABLED y STAGING_NATIVE_DEPLOY son variables del repositorio.
# Una variable de entorno de GitHub no llega a la condición del job.
# El job sigue apagado hasta que la primera sea true y la segunda sea off.
# Staging y producción comparten el proyecto amused-possibility.
# El aislamiento es el entorno staging, el servicio pegazuz-backend-staging
# y un project token creado en ese entorno. Un token de cuenta no sirve.
# No migra y no siembra.
name: Staging

on:
  push:
    branches:
      - genesis/staging
  workflow_dispatch:

concurrency:
  group: pegazuz-staging-backend
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/crm-verify.yml

  deploy:
    needs: verify
    if: vars.STAGING_DEPLOY_ENABLED == 'true' && vars.STAGING_NATIVE_DEPLOY == 'off'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rechazar un destino de producción
        env:
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          PRODUCTION_RAILWAY_PROJECT_ID: ${{ vars.PRODUCTION_RAILWAY_PROJECT_ID }}
          RAILWAY_STAGING_ENVIRONMENT_ID: ${{ vars.RAILWAY_STAGING_ENVIRONMENT_ID }}
          RAILWAY_STAGING_SERVICE_ID: ${{ vars.RAILWAY_STAGING_SERVICE_ID }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          PRODUCTION_RAILWAY_SERVICE: ${{ vars.PRODUCTION_RAILWAY_SERVICE }}
          STAGING_DB_HOST: ${{ vars.STAGING_DB_HOST }}
          STAGING_PUBLIC_HOST: ${{ vars.STAGING_PUBLIC_HOST }}
          STAGING_SMOKE_URL: ${{ vars.STAGING_SMOKE_URL }}
          STAGING_NATIVE_DEPLOY: ${{ vars.STAGING_NATIVE_DEPLOY }}
          DB_SYNCHRONIZE: 'false'
          PEGAZUZ_ENV: staging
        run: npm run check:staging-deploy
      - name: Comprobar que el token está limitado a staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_STAGING_ENVIRONMENT_ID: ${{ vars.RAILWAY_STAGING_ENVIRONMENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_STAGING_ENVIRONMENT_ID" ]; then
            echo "falta el token o el entorno fijado"
            exit 1
          fi
          token_file="${RUNNER_TEMP}/railway-scope.json"
          curl --fail --silent --show-error \
            --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Project-Access-Token: ${RAILWAY_TOKEN}" \
            --header "Content-Type: application/json" \
            --output "$token_file" \
            --data '{"query":"query { projectToken { projectId environmentId } }"}'
          npm run check:railway-token -- "$token_file"
          rm -f "$token_file"
      - name: Publicar y esperar SUCCESS de esta ejecución
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_STAGING_ENVIRONMENT_ID: ${{ vars.RAILWAY_STAGING_ENVIRONMENT_ID }}
          RAILWAY_STAGING_SERVICE_ID: ${{ vars.RAILWAY_STAGING_SERVICE_ID }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
        run: |
          set -euo pipefail
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_STAGING_ENVIRONMENT_ID" ] || [ -z "$RAILWAY_STAGING_SERVICE_ID" ]; then
            echo "falta el token o el destino de staging"
            exit 1
          fi
          if [ "$RAILWAY_ENVIRONMENT" != "staging" ] || [ "$RAILWAY_SERVICE" != "pegazuz-backend-staging" ]; then
            echo "el destino no es staging"
            exit 1
          fi
          if [ "$RAILWAY_ENVIRONMENT" = "production" ] || [ "$RAILWAY_SERVICE" = "omnichannel-backend" ]; then
            echo "producción queda fuera"
            exit 1
          fi
          up_json="$(npx --yes @railway/cli up --detach --json --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_STAGING_SERVICE_ID" --environment "$RAILWAY_STAGING_ENVIRONMENT_ID")"
          deployment_id="$(printf '%s\n' "$up_json" | node scripts/await-staging-deployment.mjs target)"
          for _ in $(seq 1 60); do
            list_json="$(npx --yes @railway/cli deployment list --json --limit 20 --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_STAGING_SERVICE_ID" --environment "$RAILWAY_STAGING_ENVIRONMENT_ID")"
            set +e
            printf '%s\n' "$list_json" | node scripts/await-staging-deployment.mjs check "$deployment_id"
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -ne 10 ]; then
              exit "$code"
            fi
            sleep 15
          done
          echo "el despliegue de esta ejecución no llegó a SUCCESS"
          exit 1
      - name: Humo
        env:
          SMOKE_URL: ${{ vars.STAGING_SMOKE_URL }}
          STAGING_PUBLIC_HOST: ${{ vars.STAGING_PUBLIC_HOST }}
        run: npm run smoke:staging
