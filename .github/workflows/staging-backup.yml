# GitHub no extrae el volcado.
# Postgres-9yd6 no tiene proxy público. El túnel SSH de Railway no publica
# una clave de host estable, así que no se usa y no se relaja su verificación.
# Cuando un respaldo esté autorizado, lo hará pegazuz-backup-staging dentro
# de la red privada de staging y solo saldrá el sobre PGZ2.
# Este flujo sigue apagado. Si alguien lo enciende, termina sin conectar.
name: Staging backup

on:
  workflow_dispatch:

concurrency:
  group: pegazuz-staging-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    if: vars.STAGING_BACKUP_ENABLED == 'true' && github.ref == 'refs/heads/genesis/staging'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/staging-private-backup.mjs refuse-github
