# Migración explícita de staging. No corre en un push.
# railway ssh ejecuta el script dentro del contenedor, en la red privada.
# El comando local del CLI solo inyecta variables en GitHub, donde el
# hostname privado no resuelve.
# STAGING_MIGRATE_ENABLED es una variable del repositorio: la condición
# del job no ve las variables del entorno de GitHub.
# Permanece apagado hasta STAGING_MIGRATE_ENABLED=true.
# Primero publica el commit y espera el humo: el script que corre es el del contenedor.
# Entra a pegazuz-backend-staging por UUID. El token tiene que ser de ese entorno.
# La base que ve el script es la del contenedor y tiene que coincidir con STAGING_DB_HOST.
name: Staging migrate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Escribe migrate-staging para continuar
        required: true
        type: string

concurrency:
  group: pegazuz-staging-migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: vars.STAGING_MIGRATE_ENABLED == 'true' && inputs.confirm == 'migrate-staging'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rechazar un destino de producción
        env:
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          PRODUCTION_RAILWAY_PROJECT_ID: ${{ vars.PRODUCTION_RAILWAY_PROJECT_ID }}
          RAILWAY_STAGING_ENVIRONMENT_ID: ${{ vars.RAILWAY_STAGING_ENVIRONMENT_ID }}
          RAILWAY_STAGING_SERVICE_ID: ${{ vars.RAILWAY_STAGING_SERVICE_ID }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          PRODUCTION_RAILWAY_SERVICE: ${{ vars.PRODUCTION_RAILWAY_SERVICE }}
          STAGING_DB_HOST: ${{ vars.STAGING_DB_HOST }}
          STAGING_PUBLIC_HOST: ${{ vars.STAGING_PUBLIC_HOST }}
          STAGING_SMOKE_URL: ${{ vars.STAGING_SMOKE_URL }}
          STAGING_NATIVE_DEPLOY: ${{ vars.STAGING_NATIVE_DEPLOY }}
          DB_SYNCHRONIZE: 'false'
          PEGAZUZ_ENV: staging
        run: npm run check:staging-deploy
      - name: Comprobar que el token está limitado a staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_STAGING_ENVIRONMENT_ID: ${{ vars.RAILWAY_STAGING_ENVIRONMENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_STAGING_ENVIRONMENT_ID" ]; then
            echo "falta el token o el entorno fijado"
            exit 1
          fi
          token_file="${RUNNER_TEMP}/railway-scope.json"
          curl --fail --silent --show-error \
            --request POST \
            --url https://backboard.railway.com/graphql/v2 \
            --header "Project-Access-Token: ${RAILWAY_TOKEN}" \
            --header "Content-Type: application/json" \
            --output "$token_file" \
            --data '{"query":"query { projectToken { projectId environmentId } }"}'
          npm run check:railway-token -- "$token_file"
          rm -f "$token_file"
      - name: Aplicar 004, 005 y 006 dentro del servicio
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_STAGING_ENVIRONMENT_ID: ${{ vars.RAILWAY_STAGING_ENVIRONMENT_ID }}
          RAILWAY_STAGING_SERVICE_ID: ${{ vars.RAILWAY_STAGING_SERVICE_ID }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
          STAGING_DB_HOST: ${{ vars.STAGING_DB_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_STAGING_ENVIRONMENT_ID" ] || [ -z "$RAILWAY_STAGING_SERVICE_ID" ]; then
            echo "el destino no es el servicio de staging"
            exit 1
          fi
          if [ "$RAILWAY_ENVIRONMENT" != "staging" ] || [ "$RAILWAY_SERVICE" != "pegazuz-backend-staging" ]; then
            echo "el destino no es staging"
            exit 1
          fi
          if [ "$RAILWAY_ENVIRONMENT" = "production" ] || [ "$RAILWAY_SERVICE" = "omnichannel-backend" ]; then
            echo "producción queda fuera"
            exit 1
          fi
          if [ -z "$STAGING_DB_HOST" ] || [[ "$STAGING_DB_HOST" == *production* ]]; then
            echo "falta el host de staging"
            exit 1
          fi
          npx --yes @railway/cli ssh \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_STAGING_SERVICE_ID" \
            --environment "$RAILWAY_STAGING_ENVIRONMENT_ID" \
            -- env \
              CRM_MIGRATE_TARGET=staging \
              CRM_STAGING_MIGRATE=yes \
              DB_SYNCHRONIZE=false \
              STAGING_DB_HOST="$STAGING_DB_HOST" \
              EXPECTED_RAILWAY_PROJECT_ID="$RAILWAY_PROJECT_ID" \
              EXPECTED_RAILWAY_ENVIRONMENT_ID="$RAILWAY_STAGING_ENVIRONMENT_ID" \
              EXPECTED_RAILWAY_SERVICE_ID="$RAILWAY_STAGING_SERVICE_ID" \
              node scripts/apply-explicit-staging-migrations.mjs
